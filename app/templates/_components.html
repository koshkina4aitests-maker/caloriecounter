{% macro card(title, value, sub=None) -%}
  <div class="rounded-2xl border border-slate-800 bg-slate-900/50 p-4">
    <div class="text-xs uppercase tracking-wider text-slate-400">{{ title }}</div>
    <div class="mt-2 text-2xl font-semibold">{{ value }}</div>
    {% if sub %}
      <div class="mt-1 text-sm text-slate-400">{{ sub }}</div>
    {% endif %}
  </div>
{%- endmacro %}
