{% extends "base.html" %}

{% block content %}
  <div class="flex flex-col gap-6">
    <section class="rounded-2xl border border-slate-800 bg-slate-900/30 p-4">
      <h1 class="text-lg font-semibold">Упражнения</h1>
      <p class="mt-1 text-sm text-slate-400">Есть базовый набор по умолчанию. Можно добавлять свои.</p>

      <form method="post" action="/exercises" class="mt-4 grid grid-cols-1 md:grid-cols-8 gap-3">
        <div class="md:col-span-3">
          <label class="block text-xs text-slate-400">Название</label>
          <input name="name" required class="mt-1 w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2 text-sm" placeholder="Напр. Жим гантелей лёжа" />
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs text-slate-400">Категория</label>
          <select name="category" class="mt-1 w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2 text-sm">
            <option value="strength">Силовое</option>
            <option value="bodyweight">С весом тела</option>
          </select>
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs text-slate-400">Группа мышц</label>
          <input name="muscle_group" class="mt-1 w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2 text-sm" placeholder="необязательно" />
        </div>
        <div class="flex items-end">
          <button class="w-full rounded-lg bg-indigo-600 hover:bg-indigo-500 px-4 py-2 text-sm font-medium">Добавить</button>
        </div>
      </form>
    </section>

    <section class="rounded-2xl border border-slate-800 bg-slate-900/30 p-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold">Список</h2>
        <div class="text-sm text-slate-400">{{ exercises|length }} шт.</div>
      </div>
      <div class="mt-3 overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="text-left text-slate-400">
            <tr>
              <th class="py-2 pr-4">Название</th>
              <th class="py-2 pr-4">Категория</th>
              <th class="py-2 pr-4">Группа</th>
              <th class="py-2 pr-2"></th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800">
            {% for e in exercises %}
              <tr>
                <td class="py-2 pr-4 font-medium">{{ e.name }}</td>
                <td class="py-2 pr-4 text-slate-300">{{ e.category }}</td>
                <td class="py-2 pr-4 text-slate-300">{{ e.muscle_group }}</td>
                <td class="py-2 pr-2">
                  <div class="flex items-center gap-3 justify-end">
                    <a class="text-xs text-indigo-300 hover:text-indigo-200" href="/progress/{{ e.id }}">прогресс</a>
                    <form method="post" action="/exercises/{{ e.id }}/delete">
                      <button class="text-xs text-slate-400 hover:text-red-300">удалить</button>
                    </form>
                  </div>
                </td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </section>
  </div>
{% endblock %}
