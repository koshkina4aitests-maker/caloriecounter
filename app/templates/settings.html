{% extends "base.html" %}

{% block content %}
  <div class="flex flex-col gap-6">
    <section class="rounded-2xl border border-slate-800 bg-slate-900/30 p-4">
      <h1 class="text-lg font-semibold">Настройки</h1>
      <p class="mt-1 text-sm text-slate-400">Вес используется для расчёта калорий по MET (кардио и силовые).</p>

      <form method="post" action="/settings" class="mt-4 grid grid-cols-1 md:grid-cols-6 gap-3 items-end">
        <div class="md:col-span-2">
          <label class="block text-xs text-slate-400">Вес, кг</label>
          <input name="body_weight_kg" type="number" step="0.1" min="20" max="300" required value="{{ settings.body_weight_kg }}" class="mt-1 w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2 text-sm" />
        </div>
        <div>
          <button class="w-full rounded-lg bg-indigo-600 hover:bg-indigo-500 px-4 py-2 text-sm font-medium">Сохранить</button>
        </div>
      </form>
    </section>
  </div>
{% endblock %}
