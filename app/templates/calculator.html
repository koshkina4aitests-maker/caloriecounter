{% extends "base.html" %}

{% block content %}
  <div class="flex flex-col gap-6">
    <section class="rounded-2xl border border-slate-800 bg-slate-900/30 p-4">
      <h1 class="text-lg font-semibold">Калькулятор калорий по БЖУ</h1>
      <p class="mt-1 text-sm text-slate-400">Формула: белки 4 ккал/г, углеводы 4 ккал/г, жиры 9 ккал/г.</p>

      <form method="get" action="/calculator" class="mt-4 grid grid-cols-1 md:grid-cols-8 gap-3 items-end">
        <div>
          <label class="block text-xs text-slate-400">Б, г</label>
          <input name="p" type="number" step="0.1" min="0" value="{{ p }}" class="mt-1 w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs text-slate-400">Ж, г</label>
          <input name="f" type="number" step="0.1" min="0" value="{{ f }}" class="mt-1 w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs text-slate-400">У, г</label>
          <input name="c" type="number" step="0.1" min="0" value="{{ c }}" class="mt-1 w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2 text-sm" />
        </div>
        <div class="md:col-span-2">
          <button class="w-full rounded-lg bg-indigo-600 hover:bg-indigo-500 px-4 py-2 text-sm font-medium">Посчитать</button>
        </div>
        <div class="md:col-span-3 rounded-xl border border-slate-800 bg-slate-950/40 px-3 py-2">
          <div class="text-xs text-slate-400">Итого</div>
          <div class="text-lg font-semibold">{{ kcal }} ккал</div>
        </div>
      </form>
    </section>
  </div>
{% endblock %}
